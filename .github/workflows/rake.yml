name: rake

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3", "3.4", "4.0"]
        experimental: [false]
        # ruby head runs on ubuntu/macos only: windows-head cannot build
        # the released ruby-ll C extension (and the vendored forks exist
        # for Opal), so that cell was permanently red with zero signal
        # (#832 follow-up).
        exclude:
          - os: windows-latest
            ruby: head
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # bundler-cache disabled: adapter pins resolve per run.
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake spec

      - name: Run rubocop
        run: bundle exec rake rubocop
