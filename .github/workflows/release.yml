# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

# Least-privilege ceiling for the called rubygems-release.yml: its release job
# needs contents:write (git tag push) and id-token:write (OIDC Trusted Publishing).
# packages:write is not required for RubyGems Trusted Publishing.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
    secrets:
      # OMIT rubygems-api-key: metanorma/ci switches to OIDC Trusted Publishing
      # when the secret is empty (USE_OIDC = rubygems-api-key == ''). Trusted
      # Publishing is already configured for lutaml gems on rubygems.org —
      # do not re-introduce LUTAML_CI_RUBYGEMS_API_KEY here.
      # pat_token is optional (private-gem checkout + GH Packages). Keep if
      # the org still uses private deps; drop once pure public.
      pat_token: ${{ secrets.LUTAML_CI_PAT_TOKEN }}

  # lutaml-model#833: the reusable release pushes the gem without ever
  # installing it — packaging regressions (gemspec globs, autoload
  # drift, fresh-bundler resolution) pass in-repo and break consumers.
  # Install the just-published version from rubygems.org and exercise
  # the boot surface from the gem's own load paths.
  smoke:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # The release job commits the version bump to main while this job
        # runs; a checkout of the dispatch-time HEAD reads the previous
        # version and smoke-tests the wrong gem (0.8.60 was smoke-checked
        # for the 0.8.61 release). Pull post-bump main before resolving.
        with:
          fetch-depth: 5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Resolve the released version
        id: version
        # From the version file, not git describe: the default checkout
        # is shallow with no tags, so git describe failed and the empty
        # version produced `gem install "lutaml-model:"`.
        run: |
          git pull --ff-only origin main
          echo "version=$(ruby -e 'print File.read(%q{lib/lutaml/model/version.rb})[/VERSION\s*=\s*"([^"]+)"/, 1]')" >> "$GITHUB_OUTPUT"
      - name: Install and smoke the released gem
        run: |
          gem install "lutaml-model:${{ steps.version.outputs.version }}" --no-document
          # The round-trip script exercises all five formats; the TOML
          # legs require an adapter gem to be present.
          gem install tomlib toml-rb --no-document
          ruby .github/scripts/test_installed_gem.rb
