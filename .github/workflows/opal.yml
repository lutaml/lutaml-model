name: opal

on:
  push:
    branches: [main]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: opal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The Opal leg is the ONLY consumer of the vendored
      # Opal-compatibility forks (#835 step 2): MRI legs run released
      # oga/ruby-ll.
      LUTAML_OPAL_FORKS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # bundler-cache disabled: the path-source oga and ruby-ll forks
          # need ragel + ruby-ll outputs generated (rake vendor:prepare)
          # before their C extensions can compile.
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install ragel
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install ruby-ll (for rake vendor:prepare)
        run: gem install ruby-ll --no-document

      - name: Generate ragel / ruby-ll outputs in vendored forks
        # Run before bundle install: the path-source oga/ruby-ll forks
        # gitignore their generated .rb/.c files. bundle install compiles
        # the C extensions via each fork's extconf.rb, which needs
        # ext/c/lexer.c to exist.
        run: rake vendor:prepare

      - name: Install dependencies
        run: bundle install

      - name: Pin moxml to the 0.5 line for the Opal boot
        # moxml 0.6 deleted lib/compat/opal (moxml#516) and the boot
        # manifest appends that path (#914); the lane stays on 0.5.x
        # until it migrates to the moxml-ts wasm binding. The gemspec
        # admits both lines (>= 0.5.139, < 0.7), so this lockfile-local
        # pin selects the Opal-compatible one without restricting
        # CRuby consumers.
        run: bundle update moxml --version '~> 0.5.139'

      - name: Run Opal tests
        run: bundle exec rake spec:opal
